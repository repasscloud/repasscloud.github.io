# Used only when the site is deployed as a Worker with static assets
# (`npx wrangler deploy`). Cloudflare Pages ignores this file because it has no
# `pages_build_output_dir`; Pages serves dist/ and runs functions/ instead.
name = "repasscloud-wwwroot"
main = "cloudflare/worker.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = false
preview_urls = false

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "404-page"
run_worker_first = ["/api/*"]

# Secret (never commit it): npx wrangler secret put MAILERSEND_API_KEY
# Optional overrides:
# [vars]
# CONTACT_TO = "hello@repasscloud.com"
# CONTACT_FROM = "hello@repasscloud.com"
